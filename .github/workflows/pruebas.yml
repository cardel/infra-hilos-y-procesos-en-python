name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Las tres formas dan el mismo resultado
        run: python -m pytest tests/ -v

      - name: Medir
        run: python -m scripts.medir

      - name: El informe está diligenciado
        run: |
          test -f INFORME.md || { echo "Falta INFORME.md"; exit 1; }
          palabras=$(wc -w < INFORME.md)
          test "$palabras" -ge 120 || { echo "INFORME.md tiene $palabras palabras: falta la tabla de tiempos o la explicación"; exit 1; }
