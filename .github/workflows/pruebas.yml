name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: "Parte 1: las tres formas dan el mismo resultado y en orden"
        run: python -m pytest tests/test_paralelo.py -v

      - name: "Parte 2: sin cerrojo se pierden abonos y con cerrojo no"
        run: python -m pytest tests/test_cuenta.py -v

      - name: "Parte 2: cinco corridas de cada una"
        run: python -m scripts.carrera

      - name: "Parte 3: la memoria compartida sí se llena"
        run: python -m pytest tests/test_compartida.py -v

      - name: "Parte 4: la cola reparte y devuelve en orden"
        run: python -m pytest tests/test_cola.py -v

      - name: Medir
        run: python -m scripts.medir

      - name: El informe está diligenciado
        run: |
          test -f INFORME.md || { echo "Falta INFORME.md"; exit 1; }
          palabras=$(wc -w < INFORME.md)
          test "$palabras" -ge 300 || { echo "INFORME.md tiene $palabras palabras: faltan tablas o explicaciones"; exit 1; }
